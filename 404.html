<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Redirection</title>
<script>
// /controleur-dgfip/qcm/cg-01  ->  /controleur-dgfip/#/qcm/cg-01
(function () {
  var p = location.pathname.split("/").filter(Boolean);
  var base = p.length && p[0] === "controleur-dgfip" ? "/" + p.shift() + "/" : "/";
  location.replace(base + (p.length ? "#/" + p.join("/") : ""));
})();
</script></head>
<body><p><a href="/controleur-dgfip/">Ouvrir le site compagnon</a></p></body></html>
